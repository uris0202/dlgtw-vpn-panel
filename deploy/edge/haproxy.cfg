global
    stats socket /run/dlvpn-edge/admin.sock mode 600 level admin
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend public_tls
    bind 0.0.0.0:443

    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    # Dynamic SNI routing from generated map
    use_backend %[req.ssl_sni,lower,map_str(/etc/haproxy/maps/sni.map,website)]

    default_backend website

backend website
    server caddy 127.0.0.1:14443 send-proxy-v2

backend germany
    server de 127.0.0.1:24443

backend netherlands
    server nl 127.0.0.1:24444

backend poland
    server pl 127.0.0.1:24445
