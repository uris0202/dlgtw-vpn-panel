x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  postgres:
    image: postgres:17
    container_name: vpnpanel-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging: *default-logging

    networks:
      - vpnpanel

  db-backup:
    image: postgres:17
    container_name: vpnpanel-db-backup
    restart: unless-stopped

    init: true
    read_only: true

    env_file:
      - .env

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: "10"
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_VERIFY_RESTORE: ${BACKUP_VERIFY_RESTORE:-true}
      BACKUP_HEALTH_MAX_AGE_MINUTES: ${BACKUP_HEALTH_MAX_AGE_MINUTES:-1560}

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup.sh"]

    volumes:
      - ./backups/postgres:/backups
      - ./scripts/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
      - ./scripts/postgres-restore.sh:/usr/local/bin/postgres-restore.sh:ro

    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD-SHELL", "find /backups/.last_success -mmin -$$BACKUP_HEALTH_MAX_AGE_MINUTES -print -quit 2>/dev/null | grep -q ."]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - vpnpanel

  backend:
    build:
      context: ./backend
      target: application
    container_name: vpnpanel-backend

    restart: unless-stopped

    init: true

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

    group_add:
      - "42001"
    volumes:
      - ./relay:/app/relay
      - vpn_monitor_data:/var/lib/vpnpanel-monitor:ro
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - vpnpanel

  vpn-monitor:
    build:
      context: ./backend
      target: vpn-monitor
    container_name: vpnpanel-vpn-monitor
    profiles: ["monitor"]
    restart: unless-stopped
    init: true
    read_only: true
    command: ["python", "-m", "app.scripts.monitor_vpn_servers"]
    env_file:
      - .env
    environment:
      VPN_MONITOR_INTERVAL_SECONDS: ${VPN_MONITOR_INTERVAL_SECONDS:-3600}
      VPN_MONITOR_CONFIRM_SECONDS: ${VPN_MONITOR_CONFIRM_SECONDS:-60}
      VPN_MONITOR_STATE_DIR: /var/lib/vpnpanel-monitor
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./relay:/app/relay:ro
      - vpn_monitor_data:/var/lib/vpnpanel-monitor
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.monitor_vpn_servers", "--health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 3m
    logging: *default-logging
    networks:
      - vpnpanel

  vpn-relay:
    image: haproxy:3.0-alpine
    container_name: vpnpanel-vpn-relay
    profiles: ["relay"]
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    read_only: true
    command: ["haproxy", "-W", "-db", "-S", "/app/relay/control/master.sock,mode,660,level,operator", "-f", "/app/relay/haproxy.cfg"]
    volumes:
      - ./relay:/app/relay:ro
      - ./relay/control:/app/relay/control
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    build: ./frontend
    container_name: vpnpanel-frontend

    restart: unless-stopped

    init: true

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - vpnpanel

  caddy:
    image: caddy:2

    container_name: vpnpanel-caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    logging: *default-logging

    networks:
      - vpnpanel

volumes:
  postgres_data:
  vpn_monitor_data:
  caddy_data:
  caddy_config:

networks:
  vpnpanel:
