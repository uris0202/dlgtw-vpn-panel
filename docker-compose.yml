x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  postgres:
    image: postgres:17
    container_name: vpnpanel-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging: *default-logging

    networks:
      - vpnpanel

  backend:
    build: ./backend
    container_name: vpnpanel-backend

    restart: unless-stopped

    init: true

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - vpnpanel

  frontend:
    build: ./frontend
    container_name: vpnpanel-frontend

    restart: unless-stopped

    init: true

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - vpnpanel

  caddy:
    image: caddy:2

    container_name: vpnpanel-caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    logging: *default-logging

    networks:
      - vpnpanel

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  vpnpanel:
